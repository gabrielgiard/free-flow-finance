name: Update prices and rebuild site

# Runs automatically on a schedule, and whenever you click "Run workflow"
# in the Actions tab. Markets are closed at weekends, so this only runs on
# weekdays.
on:
  schedule:
    # 22:30 UTC Mon-Fri = ~6:30pm New York, after the US close.
    # For every-other-day instead, change MON-FRI to MON,WED,FRI
    - cron: "30 22 * * MON-FRI"
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

# The job commits the regenerated data file back to the repo, so it needs
# write access to repository contents.
permissions:
  contents: write

# If a run is already going, don't start a second one on top of it.
concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Gather all the data first, then build the site from it. Order matters:
      # build.py reads prices.json and market.json, so both fetches must
      # complete before it runs.
      - name: Fetch live prices from Finnhub
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          if [ -z "$FINNHUB_API_KEY" ]; then
            echo "::error::FINNHUB_API_KEY secret is empty or missing."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "API key is present (${#FINNHUB_API_KEY} characters)."
          python fetch_prices.py
          echo "--- after fetch ---"
          if [ -f prices.json ]; then
            echo "prices.json written, $(wc -c < prices.json) bytes"
          else
            echo "::error::prices.json was NOT created."
            exit 1
          fi

      # Backfills a year of history the first time it runs, then appends each
      # day's close. Also writes market.json with the S&P, Nasdaq, VIX, Brent
      # and 10-year Treasury levels for the homepage. Never fails the job: if
      # the source is unreachable, the site keeps the numbers it already has.
      # Backfills a year of daily closes per company from Twelve Data the first
      # few times it runs, then skips anything already deep and just appends
      # today's close. The first full backfill takes ~20 minutes; after that
      # this step costs no API credits and finishes in seconds.
      # Never fails the job: if it errors, existing history stands.
      - name: Update price history for the charts
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python fetch_history.py || echo "History update failed — keeping existing data."

      # Revenue, share count and net debt. Runs weekly rather than daily --
      # fundamentals change quarterly, and this uses ~400 API calls.
      # Never fails the job: if it errors, the previous figures stand.
      - name: Update company fundamentals (Mondays, or any manual run)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python fetch_fundamentals.py || echo "Fundamentals update failed — keeping existing figures."
          else
            echo "Not Monday — skipping fundamentals refresh."
          fi
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

      - name: Rebuild the site data
        run: |
          python build.py
          echo "--- after build ---"
          ls -l docs/data.js prices.json 2>&1 || true

      - name: Commit the updated data
        run: |
          git config user.name  "freeflow-bot"
          git config user.email "actions@github.com"
          # One file per line, deliberately. "git add a b c" aborts entirely
          # if any single path is missing, staging nothing at all — and the
          # trailing || true hides that. This cost us weeks of stale prices.
          for f in prices.json docs/data.js docs/history.js fundamentals.json market.json; do
            [ -e "$f" ] && git add "$f"
          done
          echo "Staged:"; git diff --staged --name-only | sed 's/^/  /'
          # git commit exits non-zero when nothing changed (e.g. a holiday),
          # which is normal and shouldn't fail the run.
          if git diff --staged --quiet; then
            echo "No price changes today — nothing to commit."
          else
            git commit -m "Update prices $(date -u +'%Y-%m-%d')"
            git push
            echo "Pushed updated prices."
          fi
